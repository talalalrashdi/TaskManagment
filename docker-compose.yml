version: "3.9"

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: techflowpm-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "TechFlow!2026"
    ports:
      - "14333:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P TechFlow!2026 -C -Q 'SELECT 1' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: TechFlowPM.API/Dockerfile
    container_name: techflowpm-api
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=TechFlowPM;User Id=sa;Password=TechFlow!2026;TrustServerCertificate=True;Encrypt=False;"
      Jwt__Issuer: "TechFlowPM"
      Jwt__Audience: "TechFlowPM.Client"
      Jwt__Key: "techflowpm-super-secret-jwt-key-2026"
      Jwt__AccessTokenMinutes: "480"
      Jwt__RefreshTokenDays: "30"
      Authentication__BypassEnabled: "true"
      Authentication__BypassUserId: "1"
      Authentication__BypassName: "System Admin"
      Authentication__BypassEmail: "admin@techflow.local"
      Authentication__BypassRole: "Admin"
      Authentication__BypassDeviceName: "BYPASS-DEV"
      Encryption__Key: "techflowpm-license-secret-key-2026"
      Encryption__IV: "techflowpm-initv"
    ports:
      - "8080:8080"

  web:
    build:
      context: .
      dockerfile: techflowpm-web/Dockerfile
    container_name: techflowpm-web
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_BASE_URL: "http://localhost:8080/api/v1"
      NEXT_PUBLIC_SIGNALR_URL: "http://localhost:8080/hubs/projects"
      NEXT_PUBLIC_BYPASS_AUTH: "true"
    ports:
      - "3000:3000"

volumes:
  sqlserver-data:
