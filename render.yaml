services:
  - type: web
    name: techflowpm-api
    runtime: docker
    plan: starter
    dockerfilePath: ./TechFlowPM.API/Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://0.0.0.0:10000
      - key: Web__UseHttpsRedirection
        value: "false"
      - key: Cors__AllowAnyLocalOrigin
        value: "false"
      - key: Cors__AllowedOrigins__0
        value: https://techflowpm-web-ufoh.onrender.com
      - key: SqlServer__Host
        sync: false
      - key: SqlServer__Port
        value: "1433"
      - key: SqlServer__Database
        sync: false
      - key: SqlServer__User
        sync: false
      - key: SqlServer__Password
        sync: false
      - key: Jwt__Issuer
        value: TechFlowPM
      - key: Jwt__Audience
        value: TechFlowPM.Client
      - key: Jwt__Key
        generateValue: true
      - key: Jwt__AccessTokenMinutes
        value: "480"
      - key: Jwt__RefreshTokenDays
        value: "30"
      - key: Authentication__BypassEnabled
        value: "true"
      - key: Authentication__BypassUserId
        value: "1"
      - key: Authentication__BypassName
        value: System Admin
      - key: Authentication__BypassEmail
        value: admin@techflow.local
      - key: Authentication__BypassRole
        value: Admin
      - key: Authentication__BypassDeviceName
        value: RENDER-DEMO
      - key: Encryption__Key
        value: techflowpm-license-secret-key-2026
      - key: Encryption__IV
        value: techflowpm-initv

  - type: web
    name: techflowpm-web
    runtime: node
    plan: starter
    buildCommand: cd techflowpm-web-render && npm install && npm run build
    startCommand: cd techflowpm-web-render && npm run start -- --hostname 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22.22.0"
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://techflowpm-api-ufoh.onrender.com/api/v1
      - key: NEXT_PUBLIC_SIGNALR_URL
        value: https://techflowpm-api-ufoh.onrender.com/hubs/projects
      - key: NEXT_PUBLIC_BYPASS_AUTH
        value: "true"
